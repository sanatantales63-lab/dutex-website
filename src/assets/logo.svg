<svg 
  width="100%" 
  height="100%" 
  viewBox="0 0 100 100" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Paint Swash (Beige Texture Blob) in Background -->
  <path 
    d="M48 35C40 38 41.5 54 44 60C46.5 66 52 70 59 70C66 70 68 64 68 56C68 48 64 45.5 61 41C58 36.5 56 32 48 35Z" 
    fill="#EADCC9" 
