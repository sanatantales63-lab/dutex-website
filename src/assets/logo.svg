  />
  
  <!-- Olive Green Brush Stroke L-Shape (Left Wall & Floor Outline) -->
  <path 
    d="M35 31C35 48 34 53 36 60C38 67 43 72 50 72C57 72 65 72.5 68 72.5" 
    stroke="#5C6742" 
